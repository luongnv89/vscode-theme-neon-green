name: Deploy landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate landing page
        run: npm run build:landing

      - name: Prepare Pages artifact
        run: |
          rm -rf .site
          mkdir -p .site
          cp docs/index.html .site/index.html
          cp docs/robots.txt docs/sitemap.xml docs/llms.txt .site/
          cp screenshot-dark.png screenshot-light.png icon.png icon.svg .site/
          cp assets/warp-themes-preview.png .site/
          sed -i \
            -e 's#\.\./screenshot-dark\.png#./screenshot-dark.png#g' \
            -e 's#\.\./screenshot-light\.png#./screenshot-light.png#g' \
            -e 's#\.\./icon\.png#./icon.png#g' \
            -e 's#\.\./assets/warp-themes-preview\.png#./warp-themes-preview.png#g' \
            .site/index.html
          touch .site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
